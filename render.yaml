services:
  - type: web
    name: nexus-pulse-api
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash,gemini-flash-lite-latest
      - key: CORS_ORIGINS
        value: "https://nexus-plus-gilt.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: SUPABASE_URL
        value: https://ervfizmcgcatlwynupbt.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: ENABLE_ADMIN_BYPASS
        value: "false"
      - key: DATABASE_URL
        sync: false
