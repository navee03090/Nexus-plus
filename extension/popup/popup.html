<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pulse Curator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">NEXUS PULSE</h1>
          <p class="brand-sub">Curator Station • Phase 1</p>
        </div>
      </div>
      <span id="platformBadge" class="badge badge-platform">Detecting...</span>
    </header>

    <!-- Content / Form Area -->
    <main id="mainView">
      <!-- Loading Skeleton during auto-scrape -->
      <div id="loadingDetector" class="detector-loading">
        <div class="spinner"></div>
        <span>Analyzing page DOM & images...</span>
      </div>

      <!-- Detected Content Form -->
      <form id="curateForm" class="hidden">
        <!-- Source URL -->
        <div class="field-group">
          <label for="sourceUrl">Canonical Post URL</label>
          <input type="url" id="sourceUrl" required placeholder="https://linkedin.com/posts/..." />
        </div>

        <!-- Flyer Detection Preview -->
        <div class="field-group">
          <label>Detected Flyer Image</label>
          <div id="flyerPreviewContainer" class="flyer-preview-box empty">
            <img id="flyerImg" src="" alt="Detected Flyer" class="hidden" />
            <div id="noFlyerNotice" class="flyer-placeholder">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
              <span>No image auto-detected</span>
            </div>
          </div>
          <input type="url" id="flyerUrl" placeholder="Direct Flyer Image URL (optional)" />
        </div>

        <!-- Post Text / Caption -->
        <div class="field-group">
          <label for="rawText">Post Caption / Context</label>
          <textarea id="rawText" rows="3" placeholder="Post description, speaker info, or registration dates..."></textarea>
        </div>

        <!-- Tags Hints -->
        <div class="field-group">
          <label for="tags">Taxonomy Tags (Optional)</label>
          <input type="text" id="tags" placeholder="e.g. Hackathon, AI, Cybersecurity, Peshawar" />
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span class="btn-text">Ingest to Nexus Pulse</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <!-- Success State -->
      <div id="successView" class="success-card hidden">
        <div class="success-header">
          <div class="success-icon">✓</div>
          <div>
            <h3 id="resTitle" class="success-title">Opportunity Ingested</h3>
            <span id="resStatusBadge" class="badge badge-success">Source Verified</span>
          </div>
        </div>

        <p id="resSummary" class="success-summary"></p>

        <div class="metadata-grid">
          <div class="meta-item">
            <span class="meta-label">Deadline</span>
            <span id="resDeadline" class="meta-value">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Trust Score</span>
            <span id="resTrust" class="meta-value highlight">98%</span>
          </div>
        </div>

        <div id="qrAlert" class="qr-alert hidden">
          <span class="qr-label">Decoded QR Code:</span>
          <a id="qrLink" href="#" target="_blank" class="qr-url"></a>
        </div>

        <div class="action-buttons">
          <a id="viewLiveLink" href="#" target="_blank" class="btn btn-secondary">
            View Live in Portal ↗
          </a>
          <button type="button" id="curateAnotherBtn" class="btn btn-ghost">
            Curate Another
          </button>
        </div>
      </div>

      <!-- Error State -->
      <div id="errorAlert" class="error-alert hidden">
        <span id="errorMsg"></span>
      </div>
    </main>

    <!-- Footer Settings & Telemetry -->
    <footer class="footer">
      <div class="api-config">
        <label for="apiUrl">API Base:</label>
        <input type="text" id="apiUrl" value="http://localhost:8000" spellcheck="false" />
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
